<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG UC Clicker & Wheel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #021508, #072a1d, #03101c, #09203f);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism oyna uslubi */
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 15px;
        }

        /* Shaxsiy Kabinet */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .user-info {
            flex-grow: 1;
        }

        .user-info h3 {
            font-size: 18px;
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
        }

        .user-info p {
            font-size: 12px;
            color: #a0aec0;
        }

        .uc-badge {
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid #00d4ff;
            padding: 8px 12px;
            border-radius: 12px;
            text-align: right;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .uc-badge span {
            font-size: 18px;
            font-weight: bold;
            color: #00d4ff;
        }

        /* Navigatsiya tugmalari */
        .nav-tabs {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            color: #fff;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(45deg, rgba(0, 255, 136, 0.3), rgba(0, 212, 255, 0.3));
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        /* Tab Kontentlari */
        .tab-content {
            display: none;
            width: 100%;
            max-width: 400px;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active {
            display: flex;
        }

        /* Clicker qismi */
        .click-area {
            position: relative;
            margin: 20px 0;
        }

        .click-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ff88 0%, #005c30 70%, #012413 100%);
            border: 3px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .click-btn:active {
            transform: scale(0.93);
        }

        /* Baraban qismi */
        .wheel-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 15px 0;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 0.99);
            background: conic-gradient(
                #00ff88 0deg 60deg,   /* +25 UC */
                #ff4444 60deg 120deg,  /* -1 UC */
                #00d4ff 120deg 180deg, /* +10 UC */
                #aa0000 180deg 240deg, /* -10 UC */
                #ffbb00 240deg 300deg, /* +50 UC */
                #0055aa 300deg 360deg  /* +5 UC */
            );
            position: relative;
            overflow: hidden;
        }

        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid #00ff88;
            z-index: 10;
            filter: drop-shadow(0 0 8px #00ff88);
        }

        .spin-btn {
            margin-top: 15px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            border: none;
            border-radius: 14px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .spin-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .spins-left {
            font-size: 13px;
            color: #a0aec0;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- Shaxsiy Kabinet -->
    <div class="glass-card profile-header">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-info">
            <h3 id="userName">Yuklanmoqda...</h3>
            <p>ID: <span id="userId">00000000</span></p>
        </div>
        <div class="uc-badge">
            <p style="font-size: 10px; color: #a0aec0;">BALANS</p>
            <span id="ucBalance">0</span> UC
        </div>
    </div>

    <!-- Menyu Tablari -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('clickerTab', this)">⚡ Clicker</button>
        <button class="tab-btn" onclick="switchTab('wheelTab', this)">🎰 Baraban</button>
    </div>

    <!-- 1-TAB: CLICKER -->
    <div id="clickerTab" class="tab-content active">
        <div class="glass-card" style="text-align: center;">
            <p style="color: #a0aec0; font-size: 14px;">Tugmani bosib UC ishlang!</p>
            <div class="click-area">
                <button class="click-btn" onclick="handleClick()">
                    <span style="font-size: 40px;">🪖</span>
                    <span style="font-weight: bold; margin-top: 5px; color: #fff;">CLICK!</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 2-TAB: BARABAN -->
    <div id="wheelTab" class="tab-content">
        <div class="glass-card" style="text-align: center; display: flex; flex-direction: column; align-items: center;">
            <p style="color: #a0aec0; font-size: 14px;">Kunlik omadingizni sinab ko'ring!</p>
            
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <div class="wheel" id="wheel"></div>
            </div>

            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">AYLANTIRISH</button>
            <p class="spins-left">Bugun qolgan imkoniyat: <b id="spinsLeft" style="color: #00ff88;">10</b>/10</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // User ma'lumotlarini olish
        const user = tg.initDataUnsafe?.user || { first_name: "Gamer", id: 12345678 };
        document.getElementById('userName').innerText = user.first_name;
        document.getElementById('userId').innerText = user.id;
        document.getElementById('userAvatar').innerText = user.first_name.charAt(0).toUpperCase();

        let uc = parseInt(localStorage.getItem('uc_balance')) || 0;
        let spins = parseInt(localStorage.getItem('daily_spins')) ?? 10;
        let lastSpinDate = localStorage.getItem('last_spin_date');

        // Kun yangilanganda imkoniyatni 10 ta qilish
        const today = new Date().toDateString();
        if (lastSpinDate !== today) {
            spins = 10;
            localStorage.setItem('daily_spins', spins);
            localStorage.setItem('last_spin_date', today);
        }

        updateUI();

        function updateUI() {
            document.getElementById('ucBalance').innerText = uc;
            document.getElementById('spinsLeft').innerText = spins;
            if (spins <= 0) {
                document.getElementById('spinBtn').disabled = true;
                document.getElementById('spinBtn').innerText = "BUGUNGI LİMİT TUGADI";
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function handleClick() {
            uc += 1;
            localStorage.setItem('uc_balance', uc);
            updateUI();
        }

        let isSpinning = false;
        function spinWheel() {
            if (isSpinning || spins <= 0) return;

            isSpinning = true;
            spins--;
            localStorage.setItem('daily_spins', spins);

            const wheel = document.getElementById('wheel');

            // Возможные секторы: значение UC и градус остановки
            const rewards = [
                { value: 25, deg: 30 },
                { value: -1, deg: 90 },
                { value: 10, deg: 150 },
                { value: -10, deg: 210 },
                { value: 50, deg: 270 },
                { value: 5, deg: 330 }
            ];

            const outcome = rewards[Math.floor(Math.random() * rewards.length)];
            const totalRotation = 1440 + (360 - outcome.deg); // 4 полных круга + точный сектор

            wheel.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                uc += outcome.value;
                if (uc < 0) uc = 0; // Баланс не уходит ниже 0

                localStorage.setItem('uc_balance', uc);
                updateUI();

                if (outcome.value > 0) {
                    tg.showAlert(`Tabriklaymiz! Siz +${outcome.value} UC yutdingiz! 🎉`);
                } else {
                    tg.showAlert(`Apsus! Siz ${outcome.value} UC yo'qotdingiz! 😅`);
                }

                isSpinning = false;
            }, 4000);
        }
    </script>
</body>
</html>
